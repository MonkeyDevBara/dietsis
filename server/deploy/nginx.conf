# /etc/nginx/sites-available/dietsis  →  symlink into sites-enabled.
# Requires the snippet at /etc/nginx/snippets/dietsis-headers.conf (nginx-headers.conf from this folder).
# Obtain the certificate FIRST (see docs/DEPLOYMENT.md), otherwise `nginx -t` fails on the ssl_certificate lines.

limit_req_zone $binary_remote_addr zone=dietsis_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dietsis.transbara.my.id;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dietsis.transbara.my.id;

    ssl_certificate     /etc/letsencrypt/live/dietsis.transbara.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dietsis.transbara.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dietsis_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/dietsis/current;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # API: the Go service answers with its own security headers (CSP default-src 'none', no-store).
    location /api/ {
        limit_req zone=dietsis_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: the client must not be able to inject its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/dietsis-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry points must always be revalidated so a new release is noticed.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/dietsis-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/dietsis-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Single-page app fallback.
    location / {
        include /etc/nginx/snippets/dietsis-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
